[main]
anchor = top
font = Product Sans:size=14
dpi-aware = no
terminal = alacritty -e
y-margin = 16
width = 60
inner-pad = 16
horizontal-pad = 32
vertical-pad = 24
line-height = 32
lines = 10
icon-theme = Papirus-Dark

[border]
width = 2
radius = 20

[colors]
background = 1e1e1eef
text = d2d2d2ff
border = 505050ff
selection = 646464ff
